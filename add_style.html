<!DOCTYPE html>
<html>
<head>
    <title>Add Style</title>
</head>
<body>
    <h1>Add New Style</h1>
    <form method="POST">
        Style ID: <input type="number" name="style_id" required><br>
        Type: <input type="text" name="type" required><br>
        Origin Country: <input type="text" name="origin_country"><br>
        Description: <input type="text" name="description"><br> 
        <button type="submit">Add</button>
    </form>
</body>
</html>
